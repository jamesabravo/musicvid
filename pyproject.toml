[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "musicvid"
version = "1.0.0"
description = "Beat-synchronized 3D music video generator powered by Audio and MIDI files."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["music-video", "midi", "audio-visualizer", "blender", "demoscene", "ffmpeg"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "mido>=1.3.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "requests>=2.28.0",
]

[project.scripts]
musicvid = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

